<button (click)="onSubmit(formData)">Verify Account</button>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" class="form-control" id="email" [(ngModel)]="formData.email" required email>
      
    </div>
  
    <div class="form-group">
      <label for="code">Verification Code</label>
      <input type="text" class="form-control" id="code" [(ngModel)]="formData.code" required>
      
    </div>
  
    <button type="submit" class="btn btn-primary" [disabled]="loading">Verify Account</button>
