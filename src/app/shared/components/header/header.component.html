<header>
  <dx-toolbar class="header-toolbar">
    <!-- Menu Toggle Button -->
    <dxi-item
      *ngIf="menuToggleEnabled"
      location="before"
      widget="dxButton"
      cssClass="menu-button"
      [options]="{
        icon: 'menu',
        stylingMode: 'text',
        onClick: toggleMenu
      }">
    </dxi-item>

    <!-- Title -->
    <dxi-item
      location="before"
      cssClass="header-title">
      MLIHA
    </dxi-item>
    <dxi-item location="after" locateInMenu="auto" cssClass="right-section">
    <!-- Notification -->
    <app-notification class="notification-item"></app-notification>
    </dxi-item>

    <!-- Notification and User Profile Section -->
    <dxi-item location="after" locateInMenu="auto" cssClass="right-section">
      <div class="d-flex align-items-center">
    

        <!-- User Profile Button -->
        <dx-button
          class="user-button authorization"
          stylingMode="text">
          <div class="user-panel-container">
            <app-user-panel [user]="user" [menuItems]="userMenuItems" menuMode="context"></app-user-panel>
          </div>
        </dx-button>
      </div>
    </dxi-item>

    <!-- User Panel in Menu Item Template -->
    <div *dxTemplate="let data of 'menuItem'">
      <app-user-panel [user]="user" [menuItems]="userMenuItems" menuMode="list"></app-user-panel>
    </div>
  </dx-toolbar>
</header>
