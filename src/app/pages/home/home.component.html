<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vidéo en plein écran</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    .content-block {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgb(255, 111, 0);
      font-size: 60px;
      font-weight: bold;
      font-family: Arial, sans-serif; /* Ajouter une police de caractères professionnelle si nécessaire */
      z-index: 1;
    }
  </style>
</head>

<body>
  <h2 class="content-block">Bienvenue à Notre Site MLIHA</h2>

  <video autoplay controls>
    <source src="assets/video-mliha.mp4" type="video/mp4">
    Votre navigateur ne supporte pas la lecture de vidéos.
  </video>

  <script>
    // Lancer automatiquement le site une fois la vidéo chargée
    document.addEventListener('DOMContentLoaded', function () {
      const video = document.querySelector('video');
      video.addEventListener('loadeddata', function () {
        setTimeout(function () {
          document.querySelector('.content-block').style.display = 'none';
        }, 5000); // Cacher le titre après 5 secondes (5000 millisecondes)
      });
    });
  </script>
</body>

</html>
