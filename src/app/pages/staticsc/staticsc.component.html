<div class="container mt-5">
  <h2 class="text-center mb-4" style="color: rgb(22, 190, 22);">Statistiques des Clients par Catégorie</h2>
  <div class="content-wrapper">
    <div class="card shadow-sm table-container">
      <div class="card-body">
        <table class="table table-hover">
          <thead class="thead-dark">
            <tr>
              <th>Catégorie</th>
              <th>Nombre de Clients</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let stat of statistics">
              <td>{{ stat.libelleCatCl }}</td>
              <td>{{ stat.count }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="card shadow-sm chart-container">
      <div class="card-body">
        <canvas baseChart
                [datasets]="doughnutChartData"
                [labels]="doughnutChartLabels"
                [options]="doughnutChartOptions"
                [plugins]="doughnutChartPlugins"
                [legend]="doughnutChartLegend"
                [type]="doughnutChartType">
        </canvas>
      </div>
    </div>
  </div>
</div>
